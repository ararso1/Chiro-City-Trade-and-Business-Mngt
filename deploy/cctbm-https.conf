server {
    listen 443 ssl;
    server_name cctbm.chirocity.gov.et;
    ssl_certificate /etc/letsencrypt/live/cctbm.chirocity.gov.et/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cctbm.chirocity.gov.et/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    location / {
        set $cctbm_upstream http://cctbm-web:80;
        proxy_pass $cctbm_upstream;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name cctbm-api.chirocity.gov.et;
    ssl_certificate /etc/letsencrypt/live/cctbm.chirocity.gov.et/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cctbm.chirocity.gov.et/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    location / {
        set $cctbm_upstream http://cctbm-api:3003;
        proxy_pass $cctbm_upstream;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
