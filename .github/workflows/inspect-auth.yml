name: Inspect CCTBM authentication mappings
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -eu
            docker ps --filter label=com.docker.compose.project=chiro-auth --format '{{.Names}} {{.Image}}'
            database=$(docker ps --filter label=com.docker.compose.project=chiro-auth --format '{{.Names}} {{.Image}}' | awk '$2 ~ /^postgres:/ { print $1 }')
            test -n "$database"
            docker exec -i -e PGOPTIONS='-c default_transaction_read_only=on' "$database" sh -c 'exec psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1' <<'SQL'
            SELECT c.client_id,c.enabled,c.public_client,c.standard_flow_enabled,c.full_scope_allowed FROM client c JOIN realm r ON r.id=c.realm_id WHERE r.name='cctbm' AND c.client_id IN ('cctbm-web','cctbm-api');
            SELECT c.client_id,p.name,pc.name,pc.value FROM client c JOIN realm r ON r.id=c.realm_id JOIN protocol_mapper p ON p.client_id=c.id LEFT JOIN protocol_mapper_config pc ON pc.protocol_mapper_id=p.id WHERE r.name='cctbm' AND c.client_id='cctbm-web' ORDER BY p.name,pc.name;
            SELECT role.name AS assigned_role,c.client_id FROM user_role_mapping m JOIN keycloak_role role ON role.id=m.role_id LEFT JOIN client c ON c.id=role.client WHERE m.user_id='7026bc41-d9f9-4d1b-b3b1-6eba25f3e98e';
            SELECT c.client_id,uri.value FROM client c JOIN realm r ON r.id=c.realm_id JOIN redirect_uris uri ON uri.client_id=c.id WHERE r.name='cctbm' AND c.client_id='cctbm-web';
            SELECT email_verified,enabled,(lower(email)='cctbm@chirocity.gov.et') AS supplied_email_matches FROM user_entity WHERE id='7026bc41-d9f9-4d1b-b3b1-6eba25f3e98e';
            SQL
            app=$(docker ps --filter label=com.docker.compose.project=cctbm --filter label=com.docker.compose.service=cctbm-api --format '{{.Names}}')
            test -n "$app"
            docker inspect --format '{{index .Config.Labels "com.docker.compose.project.working_dir"}}' "$app"
            docker exec -i "$app" node <<'JS'
            const {PrismaClient}=require('@prisma/client');
            const p=new PrismaClient();
            (async()=>{
              console.log('Matching account:',await p.user.findMany({where:{email:{equals:'cctbm@chirocity.gov.et',mode:'insensitive'}},select:{id:true,role:{select:{name:true}},isActive:true}}));
              console.log('Administrators:',await p.user.findMany({where:{role:{name:'admin'}},select:{id:true,email:true,isActive:true}}));
            })().catch(e=>{console.error(e.message);process.exitCode=1}).finally(()=>p.$disconnect());
            JS
            proxy=$(docker ps --filter label=com.docker.compose.project=hrms --filter label=com.docker.compose.service=proxy --format '{{.Names}}')
            if [ -n "$proxy" ]; then docker exec "$proxy" nginx -T 2>&1 | awk '/server_name cctbm.chirocity.gov.et/ {show=30} show>0 {print; show--}'; fi
